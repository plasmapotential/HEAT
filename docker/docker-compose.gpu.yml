# Added by runDockerCompose only when nvidia-smi can see a GPU.
# A host with no NVIDIA device cannot satisfy driver: nvidia.
services:
  HEAT:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
